# Único vhost do ensaio: responde pelos dois nomes do site em 443 com o
# certificado autoassinado do build. AllowOverride All é o que os permalinks
# do WordPress (.htaccess) exigem.
<VirtualHost *:443>
  ServerName lotusotec.cl
  ServerAlias www.lotusotec.cl
  DocumentRoot /var/www/html
  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/ensaio.crt
  SSLCertificateKeyFile /etc/ssl/private/ensaio.key
  <Directory /var/www/html>
    AllowOverride All
    Require all granted
  </Directory>
  ErrorLog /proc/self/fd/2
  CustomLog /proc/self/fd/1 combined
</VirtualHost>
