AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Ambiente do lotus-site: bucket S3 privado, distribuicao CloudFront com Origin
  Access Control, role de deploy assumida por OIDC pelo GitHub Actions do
  repositorio corporativo, budget proprio, a segunda origin em /api/* para a
  funcao de contato do stack lotus-contato, e -- desde B4 -- o dominio proprio
  na distribuicao (aliases, certificado do stack lotus-dns e redirect www ->
  apex), para o smoke rodar no dominio real antes do corte. Nao encosta em DNS:
  apex e www continuam no WordPress ate B5. Depende dos stacks
  lotus-oidc-github, lotus-contato e lotus-dns ja implantados.

Parameters:
  NomeDoBucket:
    Type: String
    Default: lotus-site-prod
    Description: >-
      O namespace de nomes de bucket e GLOBAL. Se lotus-site-prod estiver
      tomado por outra conta, passe lotus-site-prod-<id-da-conta>.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'

  RepositorioDeDeploy:
    Type: String
    Default: Gatika-CL/lotus-site
    Description: >-
      owner/nome do unico repositorio autorizado a assumir a role de deploy.

  RepositorioDeDeployImutavel:
    Type: String
    Default: Gatika-CL@310231788/lotus-site@1357439884
    Description: >-
      O mesmo repositorio na forma de identificadores numericos, owner@id/nome@id.
      Medido em 2026-09-04 com
      `gh api /repos/Gatika-CL/lotus-site/actions/oidc/customization/sub`.
      Os ids nao mudam quando o repositorio ou a organizacao e renomeado.

  EmailDeAlerta:
    Type: String
    Description: Destinatario do alerta de 80% do budget.
    AllowedPattern: '^[^@]+@[^@]+$'

  TetoMensalUSD:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Teto mensal em USD somando S3, CloudFront, Route 53, SES, Lambda e CloudWatch.

  DominioDaFuncaoDeContato:
    Type: String
    Description: >-
      Output DominioDaUrlDaFuncao do stack lotus-contato: o host da Function
      URL, sem esquema nem barra. Segunda origin da distribuicao, em /api/*.
    AllowedPattern: '^[a-z0-9-]+\.lambda-url\.[a-z0-9-]+\.on\.aws$'

  ArnDaFuncaoDeContato:
    Type: String
    Description: >-
      Output ArnDaFuncao do stack lotus-contato. As duas AWS::Lambda::Permission
      e a policy da role de deploy apontam para ele.
    AllowedPattern: '^arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[a-zA-Z0-9-_]+$'

  ArnDoCertificadoDoDominio:
    Type: String
    Description: >-
      Output ArnDoCertificado do stack lotus-dns (us-east-1). Parametro, e nao
      ImportValue: o CloudFormation nao importa valor entre regioes. O
      AllowedPattern prende a regiao porque o CloudFront so aceita certificado
      de us-east-1 -- melhor reprovar no change set do que no update.
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'

Resources:
  # ── armazenamento ──────────────────────────────────────────────────────────
  Balde:
    Type: AWS::S3::Bucket
    # O bucket guarda releases/<sha>/, que e a base do rollback. delete-stack
    # derruba distribuicao, role e budget; o historico de releases sobrevive e
    # exige remocao explicita. Ver a seccao de desmonte do runbook.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NomeDoBucket
      # Sem WebsiteConfiguration de proposito: o website endpoint e HTTP puro,
      # nao aceita OAC e obrigaria o bucket a ser publico. A origem da
      # distribuicao e a API REST do S3.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Projeto
          Value: lotus-site

  # ── borda ──────────────────────────────────────────────────────────────────
  ControleDeAcesso:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Assina com SigV4 as requisicoes do CloudFront ao bucket privado.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # OAC do tipo lambda: o CloudFront assina com SigV4 cada chamada a Function
  # URL, que so aceita chamada assinada (AuthType AWS_IAM). POST exige que o
  # navegador mande x-amz-content-sha256 com o hash do corpo -- o adapter em
  # src/integrations/contact/api-contacto.ts faz isso (spec D1).
  ControleDeAcessoDaFuncao:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac-contato'
        Description: Assina com SigV4 as requisicoes do CloudFront a Function URL do contato.
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cabecalhos de seguranca em TODA resposta (7.2.2); o X-Robots-Tag saiu no
  # corte (7.2.5, spec D5). Valores canonicos em scripts/infra/lib/cabecalhos.mjs:
  # o preview do Vite serve os mesmos, e a catraca scripts/infra/cabecalhos.test.mjs
  # reprova divergencia entre este template e o modulo -- CloudFormation nao le
  # arquivo externo, entao o YAML aqui e copia vigiada.
  #
  # - CSP com default-src 'none': tudo o que o site carrega esta enumerado, e
  #   recurso novo nao previsto reprova no E2E em vez de passar calado.
  #   challenges.cloudflare.com em script-src e frame-src e o Turnstile. Sem
  #   nonce: o index.html e objeto estatico no S3, e nonce por resposta
  #   exigiria reescrever HTML na borda. Sem upgrade-insecure-requests: o
  #   preview do E2E roda em http://localhost.
  # - HSTS de um ano SEM includeSubDomains e sem preload: medido em 2026-09-27,
  #   mail.lotusotec.cl falha verificacao TLS e app.lotusotec.cl nao responde
  #   em 443 -- includeSubDomains os tornaria inalcancaveis depois do corte.
  # - Permissions-Policy vai em CustomHeadersConfig: nao ha campo nativo.
  # - Remover Server faz o CloudFront responder o proprio Server: CloudFront.
  #
  # A razao completa mora AQUI porque o campo Comment aceita no maximo 128
  # caracteres. Medido em 2026-09-04: com 286 o stack reprovou em CREATE_FAILED
  # com "The parameter Comment is too big".
  PoliticaDeCabecalhos:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-cabecalhos'
        Comment: Cabecalhos de seguranca de 7.2.2. Valores canonicos em scripts/infra/lib/cabecalhos.mjs.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true
        RemoveHeadersConfig:
          Items:
            - Header: Server
            - Header: x-amz-server-side-encryption
            - Header: x-amz-version-id

  # www -> apex por CloudFront Function no viewer-request do behavior padrao
  # (7.2.4, spec D6). Medido em 2026-09-28: o WordPress responde
  # https://www.lotusotec.cl/ com 301 para https://lotusotec.cl/, e o clone
  # precisa do mesmo. So o behavior padrao: /api/* fica sem a funcao, porque o
  # formulario e same-origin no apex e um POST redirecionado perde o corpo.
  # http -> https e do ViewerProtocolPolicy e acontece ANTES da funcao, entao
  # http://www faz dois saltos. Qualquer outro host -- o apex e o dominio do
  # CloudFront -- segue intacto. A query volta como veio, chave repetida
  # inclusa; nada e reencodado. A catraca scripts/infra/distribuicao.test.mjs
  # extrai este codigo e o roda em node:vm; FunctionCode e a ultima
  # propriedade porque o leitor textual assume isso.
  RedirecionarWww:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-redirecionar-www'
      AutoPublish: true
      FunctionConfig:
        Comment: www.lotusotec.cl -> https://lotusotec.cl, 301, caminho e query preservados.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host !== 'www.lotusotec.cl') {
            return request;
          }
          var partes = [];
          for (var chave in request.querystring) {
            var parametro = request.querystring[chave];
            var valores = parametro.multiValue
              ? parametro.multiValue.map(function (item) {
                  return item.value;
                })
              : [parametro.value];
            for (var i = 0; i < valores.length; i++) {
              partes.push(chave + '=' + valores[i]);
            }
          }
          var query = partes.length ? '?' + partes.join('&') : '';
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://lotusotec.cl' + request.uri + query },
            },
          };
        }

  # Aliases e certificado entram AQUI, em B4, e nao no corte (spec D5): com
  # eles o smoke roda contra o dominio real -- certificado, Host e CSP sob a
  # origem real -- antes de o DNS virar. Enquanto apex e www apontarem para o
  # WordPress, nenhum visitante chega por aqui com esses nomes; o dominio do
  # CloudFront continua servindo o site.
  Distribuicao:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: lotus-site
        Aliases:
          - lotusotec.cl
          - www.lotusotec.cl
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Todas as bordas (D-39, decidido em 7.2.5 por medicao). So
        # PriceClass_All inclui a America do Sul, e o visitante e chileno:
        # medido em 2026-10-05 de cinco sondas no Chile, PriceClass_100
        # respondia de Miami e de Dallas, total mediano de 854 ms, contra 31 ms
        # do WordPress. O free tier vale para todas as regioes; o budget do
        # stack continua sendo a guarda (ADR-SITE-004, Custo). A catraca
        # scripts/infra/distribuicao.test.mjs reprova outra classe.
        PriceClass: PriceClass_All
        # sni-only: sem IP dedicado (US$ 600/mes). TLSv1.2_2021 e a politica
        # recomendada; o smoke exige TLS >= 1.2 (spec §4.5 item 2).
        ViewerCertificate:
          AcmCertificateArn: !Ref ArnDoCertificadoDoDominio
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: balde
            # RegionalDomainName e nao DomainName: o alias global responde 307
            # nas primeiras horas de vida de um bucket novo, e o CloudFront
            # cacheia esse redirecionamento.
            DomainName: !GetAtt Balde.RegionalDomainName
            OriginAccessControlId: !GetAtt ControleDeAcesso.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: funcao-de-contato
            DomainName: !Ref DominioDaFuncaoDeContato
            OriginAccessControlId: !GetAtt ControleDeAcessoDaFuncao.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: balde
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized. Honra o Cache-Control que o deploy grava
          # em cada objeto: immutable nos assets com hash, no-cache no
          # index.html.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref PoliticaDeCabecalhos
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirecionarWww.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # /api/* vai para a funcao. CachingDisabled: resposta de formulario
          # nunca e cacheada. AllViewerExceptHostHeader: o corpo, o
          # content-type e o x-amz-content-sha256 chegam a funcao; o Host nao,
          # porque a Function URL so responde ao proprio host. https-only em
          # vez de redirect: um POST redirecionado perde o corpo.
          - PathPattern: /api/*
            TargetOriginId: funcao-de-contato
            ViewerProtocolPolicy: https-only
            Compress: false
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref PoliticaDeCabecalhos
        # Sem CustomErrorResponses de proposito: nao existe rota de cliente
        # para salvar (#Somos e #Cursos sao fragmentos, resolvidos no
        # navegador, que nunca chegam ate aqui). Mapear 404 para index.html com
        # status 200 devolveria 200 a qualquer caminho inventado.
      Tags:
        - Key: Projeto
          Value: lotus-site

  PoliticaDoBalde:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Balde
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontLeObjeto
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Balde.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'
          # Sem esta segunda declaracao o S3 responde 403 a chave inexistente:
          # sem permissao de listagem o principal nao consegue distinguir "nao
          # existe" de "nao pode ver", e o CloudFront repassa o 403 ao
          # visitante. Com ela o S3 responde 404, que e o que a decisao de nao
          # ter fallback de SPA exige. E listagem sobre o bucket, concedida so
          # ao principal do CloudFront e so a esta distribuicao; o bucket
          # continua sem qualquer acesso publico.
          - Sid: CloudFrontDistingue404De403
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt Balde.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'

  # As DUAS permissoes que a documentacao do CloudFront exige para OAC de
  # Function URL (spec D1), presas a esta distribuicao por SourceArn. Vivem
  # aqui, e nao no lotus-contato, porque e o ARN da distribuicao que muda de
  # lado.
  PermissaoDeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ArnDaFuncaoDeContato
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'
      FunctionUrlAuthType: AWS_IAM

  PermissaoDeInvocacao:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ArnDaFuncaoDeContato
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'

  # ── quem publica ───────────────────────────────────────────────────────────
  PapelDeDeploy:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lotus-site-deploy
      Description: Assumida por OIDC pelo GitHub Actions do repositorio corporativo.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # StringEquals e NAO StringLike. Curinga em sub e o erro classico
              # que abre a role para qualquer branch do repositorio -- ou, com
              # um curinga mal posto, para um fork.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Duas strings exatas, nao um curinga: em StringEquals a lista e
                # um OR, e cada item continua sendo comparado por igualdade.
                # A segunda forma e a que o GitHub realmente emite hoje. Medido
                # em 2026-09-04: com so a primeira, o job deploy reprovou em
                # "Could not assume role with OIDC: Not authorized to perform
                # sts:AssumeRoleWithWebIdentity", porque o sub do token vem com
                # os ids numericos. A primeira fica para o caso de a plataforma
                # voltar atras; nenhuma das duas abre outra branch nem um fork.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${RepositorioDeDeploy}:ref:refs/heads/main'
                  - !Sub 'repo:${RepositorioDeDeployImutavel}:ref:refs/heads/main'
      Policies:
        - PolicyName: publicar-no-lotus-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EscreverObjetos
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${Balde.Arn}/*'
              # sync precisa listar para saber o que ja esta la e o que apagar.
              - Sid: ListarParaSincronizar
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Balde.Arn
              - Sid: InvalidarSomenteEstaDistribuicao
                Effect: Allow
                # GetInvalidation e obrigatorio junto de CreateInvalidation:
                # `aws cloudfront wait invalidation-completed` faz polling com
                # ela. Medido em 2026-09-04: so com CreateInvalidation o job
                # reprovou em "not authorized to perform: cloudfront:GetInvalidation",
                # DEPOIS de ja ter publicado no S3, deixando o passo de limpeza
                # da raiz sem rodar. Ambas continuam presas a esta distribuicao.
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'
              # GetFunction e obrigatorio junto de UpdateFunctionCode: `aws
              # lambda wait function-updated-v2` faz polling com ela. Ambas
              # presas a esta funcao.
              - Sid: PublicarAFuncaoDeContato
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource: !Ref ArnDaFuncaoDeContato
      Tags:
        - Key: Projeto
          Value: lotus-site

  # ── guarda de custo ────────────────────────────────────────────────────────
  Teto:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-teto'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref TetoMensalUSD
          Unit: USD
        # Filtro por SERVICO e nao por tag: tag de alocacao de custo precisa
        # ser ativada no painel de billing e leva ate 24h para valer, e um
        # budget que nao mede nada e pior que nenhum.
        #
        # Route 53 entra em 7.2.1, com a zona de lotusotec.cl. O filtro e da
        # CONTA, nao do stack: a zona komit.cl, que ja existia nesta conta
        # antes de nos, passa a ser contada tambem. E o comportamento correto
        # -- o teto existe para a conta -- mas a primeira fatura filtrada
        # parece erro se isto nao estiver escrito.
        #
        # SES, Lambda e CloudWatch entram em B2, com a funcao de contato. Os
        # nomes de SES e Lambda sao os padrao do Cost Explorer, nao medidos
        # nesta conta: so aparecem em get-dimension-values depois da primeira
        # cobranca. Conferidos na primeira fatura (evidencia do bloco).
        CostFilters:
          Service:
            - Amazon Simple Storage Service
            - Amazon CloudFront
            - Amazon Route 53
            - Amazon Simple Email Service
            - AWS Lambda
            - AmazonCloudWatch
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailDeAlerta

Outputs:
  DominioDaDistribuicao:
    Description: Endereco publicado enquanto 7.2.1 nao apontar o dominio do cliente.
    Value: !GetAtt Distribuicao.DomainName

  IdDaDistribuicao:
    Description: Variavel de repositorio AWS_CLOUDFRONT_ID no corporativo.
    Value: !Ref Distribuicao

  NomeDoBaldePublicado:
    Description: Variavel de repositorio AWS_BUCKET no corporativo.
    Value: !Ref Balde

  ArnDoPapelDeDeploy:
    Description: >-
      Variavel de repositorio AWS_DEPLOY_ROLE_ARN no corporativo. A ausencia
      dela e a primeira das duas camadas que impedem o repositorio pessoal de
      publicar; a segunda e o sub fixo da trust policy.
    Value: !GetAtt PapelDeDeploy.Arn
