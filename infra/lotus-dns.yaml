AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Zona DNS de lotusotec.cl no Route 53, copia conferida da zona que a StackDNS
  servia (inventario em docs/infra/zona-dns-lotusotec.md, ADR-SITE-006), e o
  certificado ACM do dominio. Stack separado do lotus-site porque o ciclo de
  vida e outro: delete-stack do site nao pode arrastar a zona junto. NAO troca
  a delegacao -- ela e feita no painel do registrador -- e NAO aponta nada para
  o CloudFront: isso e B5.

  Regiao us-east-1 de proposito, embora o Route 53 seja global: o CloudFront so
  le certificado de us-east-1.

Parameters:
  NomeDaZona:
    Type: String
    Default: lotusotec.cl
    Description: Zona sem ponto final; o template acrescenta onde precisa.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'

  IpDoWordPress:
    Type: String
    Default: 185.146.167.195
    Description: >-
      WordPress na BlueHosting. Apex, www e sistema apontam para ele ate o
      cutover (B5). Medido em 2026-09-09.

  Ipv6DoWordPress:
    Type: String
    Default: '2a07:7800::195'
    Description: AAAA do apex. Medido em 2026-09-09.

  TtlPadrao:
    Type: Number
    Default: 3600
    MinValue: 60
    Description: >-
      TTL de toda a zona atual. Copia fiel: mudar o TTL aqui mudaria o
      comportamento durante a propagacao da troca de nameservers.

  # Os tres tokens do Easy DKIM da identidade SES (stack lotus-contato,
  # sa-east-1). Sao Default por dois motivos: a catraca de zona.test.mjs so le
  # parametro com Default, e o valor e publico -- e o nome de uma chave
  # publica. Trocar a identidade troca os tres.
  TokenDkim1:
    Type: String
    Default: whkczrifauntvx6dy3r5uwx4g7w2p4p2
    AllowedPattern: '^[a-z0-9]+$'

  TokenDkim2:
    Type: String
    Default: veys5msb7mgj6vstojj4pmsnfs5htq5g
    AllowedPattern: '^[a-z0-9]+$'

  TokenDkim3:
    Type: String
    Default: ilecjqmzurmfbtcete7ip5sdurjx6irz
    AllowedPattern: '^[a-z0-9]+$'

  IpDaIntranet:
    Type: String
    Default: 18.230.53.197
    Description: >-
      EIP da EC2 do Lotus (intranet), sa-east-1. O nome e `app` por decisao
      de Joao em 2026-09-27 (ADR-14 do repo lotus-infra, emenda). Sem AAAA:
      o EIP nao tem IPv6.
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}$'

Resources:
  Zona:
    Type: AWS::Route53::HostedZone
    # Retain nos dois sentidos. Uma hosted zone recriada ganha nameservers
    # NOVOS, e sao eles que o registrador aponta: apagar esta zona por acidente
    # derruba o site e o e-mail corporativo junto, e nao basta recria-la.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref NomeDaZona
      HostedZoneConfig:
        Comment: Zona do site e do e-mail corporativo; ADR-SITE-006, bloco B1.
      HostedZoneTags:
        - Key: Projeto
          Value: lotus-site

  Registros:
    Type: AWS::Route53::RecordSetGroup
    # D-52: a zona ja era Retain, os registros nao. Sem isto um delete-stack
    # apaga MX, SPF e o resto e deixa a zona retida VAZIA, com o e-mail da
    # empresa fora do ar. Termination protection ligada pelo Joao na mesma
    # rodada; as duas protecoes, nao uma.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId: !Ref Zona
      # NS e SOA do apex nao entram: a zona ja nasce com os dois, e declara-los
      # brigaria com o delegation set que a AWS escolheu.
      #
      # O wildcard da zona atual (`*.lotusotec.cl`, D-45) tambem nao entra. Os
      # dois nomes que hoje so existem por causa dele e nao podem quebrar --
      # www e sistema -- nascem explicitos, com o mesmo IP que o wildcard
      # devolve.
      RecordSets:
        - Name: !Sub '${NomeDaZona}.'
          Type: A
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref IpDoWordPress

        - Name: !Sub '${NomeDaZona}.'
          Type: AAAA
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref Ipv6DoWordPress

        # Google Workspace: e o e-mail da empresa, e e o registro que mais
        # exige conferencia antes e depois da troca de nameservers.
        - Name: !Sub '${NomeDaZona}.'
          Type: MX
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - '1 ASPMX.L.GOOGLE.COM.'
            - '5 ALT1.ASPMX.L.GOOGLE.COM.'
            - '5 ALT2.ASPMX.L.GOOGLE.COM.'
            - '10 ALT3.ASPMX.L.GOOGLE.COM.'
            - '10 ALT4.ASPMX.L.GOOGLE.COM.'

        # O include:spf.stackmail.com atravessa como esta. Decidir sobre ele e
        # B2, junto com DKIM e DMARC (D-46).
        - Name: !Sub '${NomeDaZona}.'
          Type: TXT
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - '"v=spf1 include:_spf.google.com include:spf.stackmail.com -all"'

        - Name: !Sub 'www.${NomeDaZona}.'
          Type: A
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref IpDoWordPress

        # O wildcard do painel tem A e AAAA. Sem este registro, cliente
        # dual-stack perde IPv6 em www na troca de delegacao.
        - Name: !Sub 'www.${NomeDaZona}.'
          Type: AAAA
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref Ipv6DoWordPress

        # Registro de DNS e nada mais. Nao abre a 8.2.1, congelada por Joao em
        # 2026-09-09.
        - Name: !Sub 'sistema.${NomeDaZona}.'
          Type: A
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref IpDoWordPress

        - Name: !Sub 'sistema.${NomeDaZona}.'
          Type: AAAA
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref Ipv6DoWordPress

        - Name: !Sub 'mail.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - ghs.googlehosted.com.

        - Name: !Sub 'smtp.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - smtp.stackmail.com.

        - Name: !Sub 'imap.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - imap.stackmail.com.

        # Existe no painel e a sondagem de 2026-09-09 nao podia te-lo achado:
        # `pop` foi perguntado e devolveu o IP do apex pelo wildcard; `pop3`
        # nao foi perguntado. Sem ele, a troca derruba POP3 de quem ainda usa
        # o correio antigo.
        - Name: !Sub 'pop3.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - pop3.stackmail.com.

        - Name: !Sub 'autodiscover.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - autodiscover.stackmail.com.

        - Name: !Sub 'ftp.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - ftp.us.stackcp.com.

        # ── SES (bloco B2, ADR-SITE-005) ──────────────────────────────────
        # Easy DKIM: tres CNAME para a chave publica que a AWS hospeda. O
        # seletor e o token, entao nao colide com o DKIM do Google Workspace
        # (google._domainkey), que continua em D-46.
        - Name: !Sub '${TokenDkim1}._domainkey.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Sub '${TokenDkim1}.dkim.amazonses.com.'

        - Name: !Sub '${TokenDkim2}._domainkey.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Sub '${TokenDkim2}.dkim.amazonses.com.'

        - Name: !Sub '${TokenDkim3}._domainkey.${NomeDaZona}.'
          Type: CNAME
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Sub '${TokenDkim3}.dkim.amazonses.com.'

        # MAIL FROM em subdominio proprio: o Return-Path passa a ser
        # ...@ses.lotusotec.cl e o SPF alinha ao dominio. O MX recebe os
        # bounces; a regiao esta no nome.
        - Name: !Sub 'ses.${NomeDaZona}.'
          Type: MX
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - '10 feedback-smtp.sa-east-1.amazonses.com.'

        - Name: !Sub 'ses.${NomeDaZona}.'
          Type: TXT
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - '"v=spf1 include:amazonses.com ~all"'

        # DMARC em p=none: nao muda a entrega de nada, so gera o relatorio
        # agregado na caixa que ja existe (spec D11). Fecha a parte DMARC de
        # D-46; o DKIM do Google e o include:spf.stackmail.com continuam la.
        - Name: !Sub '_dmarc.${NomeDaZona}.'
          Type: TXT
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - '"v=DMARC1; p=none; rua=mailto:contacto@lotusotec.cl"'

        # ── Intranet do Lotus (item 32 do repo lotus-infra) ─────────────────────
        # Nasce no Route 53, nunca existiu no painel. Sem AAAA: o EIP nao tem
        # IPv6. `sistema` continua no WordPress ate B5/8.2.1 -- nao e a
        # intranet, por decisao de Joao em 2026-09-27.
        - Name: !Sub 'app.${NomeDaZona}.'
          Type: A
          TTL: !Ref TtlPadrao
          ResourceRecords:
            - !Ref IpDaIntranet

  Certificado:
    Type: AWS::CertificateManager::Certificate
    # Entra so depois da delegacao ter convergido. Com HostedZoneId o
    # CloudFormation cria o CNAME de validacao nesta zona, e ele fica: e por
    # ele que o ACM revalida a cada renovacao -- mas se o mundo ainda lesse a
    # StackDNS, ninguem enxergaria esse CNAME e o stack ficaria em
    # CREATE_IN_PROGRESS ate o timeout.
    #
    # SANs explicitos, NUNCA wildcard: wildcard amplia o raio de uma
    # chave comprometida e esconde o inventario de nomes.
    Properties:
      DomainName: !Ref NomeDaZona
      SubjectAlternativeNames:
        - !Sub 'www.${NomeDaZona}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref NomeDaZona
          HostedZoneId: !Ref Zona
        - DomainName: !Sub 'www.${NomeDaZona}'
          HostedZoneId: !Ref Zona
      Tags:
        - Key: Projeto
          Value: lotus-site

Outputs:
  NameServers:
    Description: >-
      Os quatro nameservers desta zona. Sao eles que vao para o painel do
      registrador no bloco da delegacao, e recriar a zona troca os quatro.
    Value: !Join
      - ','
      - !GetAtt Zona.NameServers

  IdDaZona:
    Description: Entrada de aws route53 list-resource-record-sets --hosted-zone-id.
    Value: !Ref Zona

  ArnDoCertificado:
    Description: >-
      Consumido por B5 como PARAMETRO do stack do site, nao por ImportValue:
      o certificado e us-east-1 e a distribuicao e sa-east-1, e o
      CloudFormation nao importa valor entre regioes.
    Value: !Ref Certificado
